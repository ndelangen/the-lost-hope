name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name != 'schedule' && github.ref == 'refs/heads/main' && 'release-main' || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The generator reuses derivatives whose source digest is unchanged, so a partial
      # restore (restore-keys) still skips every image the change did not touch.
      - name: Restore responsive images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            public/assets/generated-images
            node_modules/.cache/responsive-images.json
          key: responsive-images-${{ hashFiles('assets/images.lock.json', 'scripts/image-sources.ts', 'scripts/generate-responsive-images.ts') }}
          restore-keys: responsive-images-

      # Same checks as `bun run verify`, split into steps so a failure is easy to spot.
      # Responsive images are generated once (by typecheck) and reused by the steps after it.
      # Originals live in R2; generate:images fetches them on first use.
      - name: Original artwork is uploaded and out of git
        run: bun run media:gate

      - name: Generated refs are current
        run: bun run generate:refs:check

      - name: Icon catalog is current
        run: bun run generate:icons:check

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Formatting
        run: bun run fmt:check

      - name: Tests and coverage
        run: bunx vitest run --coverage

      - name: Summarize coverage
        if: ${{ !cancelled() && hashFiles('output/coverage/coverage-summary.json') != '' }}
        run: |
          {
            echo '### Test coverage'
            echo '| Metric | Coverage |'
            echo '| --- | ---: |'
            jq -r '.total | to_entries[] | "| \(.key) | \(.value.pct)% |"' \
              output/coverage/coverage-summary.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('output/coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: output/coverage/
          retention-days: 14

      - name: Build
        run: bunx vite build && bun scripts/configure-netlify-server.ts

      - name: Delivery footprint audit
        run: bun run audit:delivery

      - name: Restore Chromium
        id: chromium-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # The runner image already has Chromium's system libraries; only a cache miss downloads.
      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Image viewer browser tests
        run: bun run test:image-viewer

      - name: Location connection browser tests
        run: bun run test:location-connections

  workflow-lint:
    name: Workflow lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: .github

      - name: Check workflow syntax and expressions
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  codecov:
    name: Codecov
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          # Codecov needs the commit and the file list, not the 580 MB of image blobs.
          filter: blob:none
          sparse-checkout: .github

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: output/coverage

      - name: Publish coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: output/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true

  deploy:
    name: Deploy to Netlify
    needs: [verify, workflow-lint, codecov, dependency-audit]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://the-lost-hope.netlify.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Netlify CLI
        run: npm install --prefix "$RUNNER_TEMP/netlify-cli" --no-audit --no-fund netlify-cli@27.20.1

      - name: Build and audit production files
        env:
          CORRECTIONS_ACCESS_CODE_SHA256: ${{ secrets.CORRECTIONS_ACCESS_CODE_SHA256 }}
          NETLIFY: 'true'
          DEPLOY_ID: github-production-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if ! [[ "$CORRECTIONS_ACCESS_CODE_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo 'A production correction-access digest is required.' >&2
            exit 1
          fi
          bun run build:deploy

      - name: Check that this commit is still on top of main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipped deployment because main advanced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish on Netlify
        id: publish
        if: steps.current.outputs.publish == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: |
          : "${NETLIFY_AUTH_TOKEN:?Set the production Netlify deploy token}"
          : "${NETLIFY_SITE_ID:?Set the production Netlify site ID}"
          "$RUNNER_TEMP/netlify-cli/node_modules/.bin/netlify" deploy \
            --no-build --prod --dir dist/client --message "GitHub Actions: $GITHUB_SHA" \
            --json > "$RUNNER_TEMP/netlify-deploy.json"
          deploy_id=$(jq -er --arg site "$NETLIFY_SITE_ID" \
            'select(.site_id == $site) | .deploy_id | select(type == "string" and length > 0)' \
            "$RUNNER_TEMP/netlify-deploy.json")
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "Netlify deployment: $deploy_id" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the live site
        if: steps.current.outputs.publish == 'true'
        env:
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          EXPECTED_DEPLOY_ID: ${{ steps.publish.outputs.deploy_id }}
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID" |
              jq --exit-status --arg id "$EXPECTED_DEPLOY_ID" '.published_deploy.id == $id' > /dev/null; then
              break
            fi
            if [[ "$attempt" == 12 ]]; then
              echo 'Netlify did not publish the deployment returned by the CLI.' >&2
              exit 1
            fi
            sleep 5
          done
          origin=https://the-lost-hope.netlify.app
          curl --fail --silent --show-error --retry 5 "$origin/" --output "$RUNNER_TEMP/home.html"
          social_image=$(grep -oE 'property="og:image" content="[^"]+"' "$RUNNER_TEMP/home.html" |
            sed -n '1s/.*content="\([^"]*\)"/\1/p')
          [[ "$social_image" == "$origin/social-previews/"* ]]
          curl --fail --silent --show-error --retry 5 "$social_image" --output /dev/null
          curl --fail --silent --show-error --retry 5 "$origin/dm" --output /dev/null
          status=$(curl --silent --show-error --retry 5 --write-out '%{http_code}' \
            "$origin/api/corrections/submit" --output "$RUNNER_TEMP/corrections.json")
          [[ "$status" == 405 ]]
          jq --exit-status '.code == "method_not_allowed"' "$RUNNER_TEMP/corrections.json"

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            package.json
            bun.lock
          sparse-checkout-cone-mode: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Report high and critical dependency advisories
        id: audit
        # Surface the existing backlog without blocking unrelated changes.
        continue-on-error: true
        run: bun audit --audit-level=high

      - name: Flag unsuccessful audit
        if: steps.audit.outcome == 'failure'
        run: |
          echo '::warning::Dependency audit did not pass. See the audit step for details.'
          echo '### Dependency audit needs attention' >> "$GITHUB_STEP_SUMMARY"
          echo 'See the audit step for high and critical advisories or scanner errors.' >> "$GITHUB_STEP_SUMMARY"
