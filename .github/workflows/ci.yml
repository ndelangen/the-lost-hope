name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Same checks as `bun run verify`, split into steps so a failure is easy to spot.
      # Responsive images are generated once (by typecheck) and reused by the steps after it.
      - name: Generated refs are current
        run: bun run generate:refs:check

      - name: Icon catalog is current
        run: bun run generate:icons:check

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Formatting
        run: bun run fmt:check

      - name: Tests
        run: bunx vitest run

      - name: Build
        run: bunx vite build

      - name: Delivery footprint audit
        run: bun run audit:delivery
