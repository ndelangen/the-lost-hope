name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Same checks as `bun run verify`, split into steps so a failure is easy to spot.
      # Responsive images are generated once (by typecheck) and reused by the steps after it.
      - name: Generated refs are current
        run: bun run generate:refs:check

      - name: Icon catalog is current
        run: bun run generate:icons:check

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Formatting
        run: bun run fmt:check

      - name: Tests and coverage
        run: bunx vitest run --coverage

      - name: Summarize coverage
        if: ${{ !cancelled() && hashFiles('output/coverage/coverage-summary.json') != '' }}
        run: |
          {
            echo '### Test coverage'
            echo '| Metric | Coverage |'
            echo '| --- | ---: |'
            jq -r '.total | to_entries[] | "| \(.key) | \(.value.pct)% |"' \
              output/coverage/coverage-summary.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('output/coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: output/coverage/
          retention-days: 14

      - name: Build
        run: bunx vite build

      - name: Delivery footprint audit
        run: bun run audit:delivery

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Image viewer browser tests
        run: bun run test:image-viewer

      - name: Location connection browser tests
        run: bun run test:location-connections

  workflow-lint:
    name: Workflow lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check workflow syntax and expressions
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  codecov:
    name: Codecov
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: output/coverage

      - name: Publish coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: output/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9

      - name: Report high and critical dependency advisories
        id: audit
        # Surface the existing backlog without blocking unrelated changes.
        continue-on-error: true
        run: bun audit --audit-level=high

      - name: Flag unsuccessful audit
        if: steps.audit.outcome == 'failure'
        run: |
          echo '::warning::Dependency audit did not pass. See the audit step for details.'
          echo '### Dependency audit needs attention' >> "$GITHUB_STEP_SUMMARY"
          echo 'See the audit step for high and critical advisories or scanner errors.' >> "$GITHUB_STEP_SUMMARY"
