name: Build production artifact

on:
  workflow_dispatch:
    inputs:
      corrections_digest:
        description: Existing production correction-access SHA-256 digest
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-artifact
  cancel-in-progress: false

jobs:
  build:
    name: Build for a manual production deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      # This explicitly dispatched deployment job renders the complete social-image set.
      # Ordinary CI and local development keep using the lightweight path manifests.
      CORRECTIONS_ACCESS_CODE_SHA256: ${{ inputs.corrections_digest }}
      NETLIFY: 'true'
      DEPLOY_ID: github-production-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate the correction-access configuration
        run: |
          if ! [[ "$CORRECTIONS_ACCESS_CODE_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo 'A production correction-access digest is required.' >&2
            exit 1
          fi

      - name: Build deployment files and audit the public output
        run: bun run build:deploy

      - name: Package the deployment and its source identity
        run: |
          git rev-parse HEAD > production-commit.txt
          tar -czf production-artifact.tar.gz dist .netlify/v1 production-commit.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-artifact
          path: production-artifact.tar.gz
          retention-days: 3
